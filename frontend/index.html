<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Frontend — Inicio</title>
  <style>
    :root {
      --bg: #140b1a;
      --card: #20132b;
      --border: #43285c;
      --text: #f3e8f5;
      --muted: #b89ac9;
      --primary: #f368e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .welcome-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { margin-top: 0; color: var(--primary); }
    p { color: var(--muted); margin-bottom: 2rem; }
    .nav-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--primary);
      color: #2a0826;
      border: 0;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="welcome-card">
    <h1>Request Frontend</h1>
    <p>Dos entregas, un proyecto con identidad propia.</p>
    <div class="nav-links">
      <a class="btn" href="./app/">/app — Interfaz (05A)</a>
      <a class="btn" href="./learn/">/learn — Auth (05B)</a>
    </div>
  </div>
</body>
</html>
